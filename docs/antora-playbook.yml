site:
  title: Antora Site Builder
  url: https://antora-supplemental.github.io/antora-build-action
  start_page: manual::index.adoc
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://antora-supplemental.github.io/antora-build-action/sitemap.xml

content:
  sources:
    # Playbook in docs/; Antora component is docs/content (repo root is parent for git).
    - url: ..
      branches: HEAD
      start_path: docs/content

output:
  dir: ./build/site

ui:
  bundle:
    url: https://github.com/antora-supplemental/antora-dark-mode/releases/download/v1.2.0/ui-bundle.zip
    snapshot: true

antora:
  extensions:
    - require: '@antora/lunr-extension'

asciidoc:
  attributes:
    experimental: ''
    source-highlighter: highlight.js
    icons: font
