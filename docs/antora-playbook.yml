site:
  title: Antora Site Builder
  url: https://antora-supplemental.github.io/antora-build-action/
  start_page: manual::index.adoc

content:
  sources:
    # Playbook in docs/; Antora component is docs/content (repo root is parent for git).
    - url: ..
      branches: HEAD
      start_path: docs/content

output:
  dir: ./build/site

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./node_modules/antora-dark-theme/supplemental-ui

asciidoc:
  attributes:
    experimental: ''
    source-highlighter: highlight.js
    icons: font
